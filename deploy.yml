name: Deploy Tụng Niệm ULTRA 3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages site
        run: |
          set -e
          mkdir -p site
          cp index_ultra_3_0_2026.html site/index.html
          cp index_ultra_3_0_2026.html site/index_ultra_3_0_2026.html
          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
